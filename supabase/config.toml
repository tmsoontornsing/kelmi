# Local development settings only (supabase start). Nothing here is read from or sent to the cloud project.
project_id = "kavi"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

# These functions check the caller's token themselves (asCaller in _shared/http.ts), so the gateway's JWT check is off.
[functions.generate-plan]
verify_jwt = false

[functions.grocery-list]
verify_jwt = false

[functions.meal-options]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.apple-link]
verify_jwt = false

# The app's door to the project (it holds no anon key, so it has nothing to send for the platform's JWT check; every request
# is checked at the project itself once forwarded) and the settings the app is handed after sign-in.
[functions.gateway]
verify_jwt = false

[functions.app-config]
verify_jwt = false

# Called by RevenueCat, which can't send a Supabase JWT; the function checks REVENUECAT_WEBHOOK_SECRET itself.
[functions.revenuecat-webhook]
verify_jwt = false
